schema_version: 1

# Arquivo público, curto e revisado pela CEO.
# Não incluir conteúdos de documentos, URLs privadas, dados de clientes,
# credenciais, prompts internos ou informações operacionais confidenciais.

project:
  name: "Amazô.guia"
  challenge: "G10"
  phase: "mvp_funcional"
  public_summary: "MVP funcional entregue. Agente SDR-RAG com LangGraph, Groq (Llama 3.1) e Streamlit. Deploy público ativo."

rag:
  source_catalog_status: "aprovado"
  approved_document_groups:
    - "perfil-lidi-moura"
    - "trajetoria"
    - "encontro-dagua-hub"
    - "catalogo-produtos-servicos"
    - "canais-e-roteamento"
    - "amazo-guia"
    - "faq-publico"
    - "formacao-ferramentas"
    - "projetos-portfolio"
  ingestion_status: "concluido"
  test_status: "qa_basico_pendente_validacao"
  stack:
    llm: "Llama 3.1 70B Versatile (Groq)"
    fallback_llm: "Llama 3.1 8B Instant (Groq)"
    embeddings: "all-MiniLM-L6-v2"
    vector_store: "InMemoryVectorStore"
    orchestration: "LangGraph ReAct"
    interface: "Streamlit"
    deploy: "Streamlit Cloud"

deploy:
  url: "https://amazo-guia-g10.streamlit.app/"
  platform: "Streamlit Cloud"
  status: "ativo"
  secret: "GROQ_API_KEY (via st.secrets)"

showcase:
  update_required: true
  update_reason: "Migração LLM Gemini → Groq documentada. Deploy ativo confirmado. Stack final definida. Aguardando validação QA e prints de evidência para publicação."
  public_evidence:
    - "Deploy público: https://amazo-guia-g10.streamlit.app/"
    - "Repositório: https://github.com/lidimoura/amazo-guia-g10"

governance:
  review_status: "entrega_challenge_realizada_pendente_qa_e_evidencias"
  owner: "Lídi Moura"
  publication_rule: "Toda atualização pública exige aprovação explícita da CEO."
